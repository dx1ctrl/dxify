# Builds dxify's tweak and the optional SponsorBlock integration on every push and pull request, so
# source changes are compiled before a release. No Spotify IPA is needed: the flag table comes from
# SG_FLAG_LIST when the repository has it, and is an empty stub otherwise.
name: Build

on:
  push:
  pull_request:

jobs:
  tweak:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: brew install make dpkg ldid

      - name: Flag table
        env:
          SG_FLAG_LIST: ${{ secrets.SG_FLAG_LIST }}
        run: |
          if [ -n "$SG_FLAG_LIST" ]; then
            echo "$SG_FLAG_LIST" | base64 -d | gunzip > tweak/Sources/Shared/Flags/SGFlagList.m
          else
            printf '#import "Flags.h"\nconst SGFlagDef SGFlagTable[] = {{"", SGFlagUnknown, 0, 0, 0}};\nconst NSUInteger SGFlagCount = 0;\n' \
              > tweak/Sources/Shared/Flags/SGFlagList.m
          fi

      - name: Build
        run: env -u MAKELEVEL gmake -C tweak clean package

  eevee-sponsorblock:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: brew install make dpkg ldid

      - name: Build Reincarnated SponsorBlock integration
        run: bash scripts/build-eevee.sh

      - uses: actions/upload-artifact@v5
        with:
          name: eevee-sponsorblock-build
          path: |
            out/eevee/*.deb
            out/eevee/EeveeSpotifyReincarnated-source.tar.gz
            out/eevee/EeveeSpotifyReincarnated-LICENSE.txt
            out/eevee/BUILD-INFO.txt
          if-no-files-found: error
